<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kidZone — Mapa miejsc przyjaznych dzieciom</title>

    <!-- Open Graph (preview w messengerach / social media) -->
    <meta property="og:title" content="kidZone — sprawdź to miejsce!">
    <meta property="og:description" content="Najlepsze miejsca dla dzieci w Twojej okolicy. Place zabaw, parki, atrakcje.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://playground-705e7162.web.app">

    <!-- Android App Link: intent:// fallback -->
    <link rel="alternate" href="android-app://com.kidzone/kidzone/place/">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #E3F2FD 0%, #F5F8FB 50%, #E8F5E9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 48px 32px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 8px;
        }

        .brand {
            font-size: 28px;
            font-weight: 700;
            color: #1E88E5;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 14px;
            color: #666;
            margin-bottom: 32px;
        }

        .message {
            font-size: 18px;
            color: #333;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .description {
            font-size: 14px;
            color: #666;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }

        .btn-primary {
            background: #1E88E5;
            color: white;
            margin-bottom: 12px;
        }

        .btn-secondary {
            background: #43A047;
            color: white;
        }

        .btn-open {
            background: #FFC93C;
            color: #1A1A1A;
            margin-bottom: 12px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #999;
        }

        .spinner {
            display: none;
            margin: 16px auto;
            width: 32px;
            height: 32px;
            border: 3px solid #E3F2FD;
            border-top-color: #1E88E5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .spinner.active {
            display: block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🧸</div>
        <div class="brand">kidZone</div>
        <div class="tagline">Mapa miejsc przyjaznych dzieciom</div>

        <div class="message">Ktoś udostępnił Ci miejsce!</div>
        <div class="description">
            Otwórz w aplikacji kidZone, aby zobaczyć szczegóły, zdjęcia i opinie innych rodziców.
        </div>

        <div class="spinner" id="spinner"></div>

        <div class="buttons" id="buttons">
            <a class="btn btn-open" id="btn-open" href="#">Otwórz w kidZone</a>
            <a class="btn btn-primary" id="btn-store"
               href="https://play.google.com/store/apps/details?id=com.kidzone">
                Pobierz z Google Play
            </a>
        </div>

        <div class="footer">
            Nie masz aplikacji? Pobierz ją za darmo z Google Play.
        </div>
    </div>

    <script>
        (function() {
            // Wyciągnij placeId z URL: /place/{placeId} lub /place/index.html?id={placeId}
            var path = window.location.pathname;
            var segments = path.split('/').filter(Boolean);
            var placeId = '';

            // /place/{placeId} format
            if (segments.length >= 2 && segments[0] === 'place') {
                placeId = segments[1];
                // Nie bierz "index.html" jako placeId
                if (placeId === 'index.html') placeId = '';
            }

            // Fallback: ?id= query param
            if (!placeId) {
                var params = new URLSearchParams(window.location.search);
                placeId = params.get('id') || '';
            }

            var deepLink = placeId
                ? 'kidzone://place/' + placeId
                : 'kidzone://';
            var webLink = placeId
                ? 'https://playground-705e7162.web.app/place/' + placeId
                : 'https://playground-705e7162.web.app';

            // Ustaw link "Otwórz w kidZone"
            var btnOpen = document.getElementById('btn-open');
            btnOpen.href = deepLink;

            // Próba automatycznego otwarcia w appce (intent-based)
            // Jeśli nie zadziała w ciągu 2s, user kliknie ręcznie
            var isAndroid = /android/i.test(navigator.userAgent);
            var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

            if (isAndroid && placeId) {
                // Spróbuj intent:// scheme (otworzy appkę bez pytania)
                var intentUrl = 'intent://place/' + placeId
                    + '#Intent;scheme=kidzone;package=com.kidzone;'
                    + 'S.browser_fallback_url=' + encodeURIComponent(
                        'https://play.google.com/store/apps/details?id=com.kidzone'
                    ) + ';end';
                btnOpen.href = intentUrl;

                // Auto-redirect po krótkim opóźnieniu
                var spinner = document.getElementById('spinner');
                spinner.classList.add('active');
                setTimeout(function() {
                    window.location.href = intentUrl;
                }, 500);
                setTimeout(function() {
                    spinner.classList.remove('active');
                }, 2500);
            }
        })();
    </script>
</body>
</html>
