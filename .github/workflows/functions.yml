name: Cloud Functions CI

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
  pull_request:
    branches: [main]
    paths:
      - 'functions/**'

concurrency:
  group: functions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: functions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src/ --ext .ts

      - name: TypeScript compile
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
