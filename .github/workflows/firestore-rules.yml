name: Firestore Rules Tests

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'tests/firestore-rules/**'
      - '.github/workflows/firestore-rules.yml'
  pull_request:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'tests/firestore-rules/**'
      - '.github/workflows/firestore-rules.yml'

permissions:
  contents: read

concurrency:
  group: firestore-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install test dependencies
        working-directory: tests/firestore-rules
        run: npm install

      - name: Start Firestore emulator and run tests
        working-directory: tests/firestore-rules
        run: |
          firebase emulators:exec --only firestore --project kidzone-rules-test \
            "npx vitest --run"
