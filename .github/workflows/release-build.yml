name: Manual Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create dummy google-services.json
        run: |
          cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder-ci",
              "storage_bucket": "placeholder-ci.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "com.kidzone" }
              },
              "api_key": [{ "current_key": "AIzaSyPlaceholder" }]
            }],
            "configuration_version": "1"
          }
          EOF

      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          MAPS_API_KEY: "AIzaSyPlaceholder"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-unsigned-or-debug-signed
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload mapping file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/
          retention-days: 14
