name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'CONTRIBUTING.md'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'CONTRIBUTING.md'
      - '.github/workflows/**'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for versionCode (git rev-list --count)

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Create dummy google-services.json
        run: |
          cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder-ci",
              "storage_bucket": "placeholder-ci.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "com.kidzone" }
              },
              "api_key": [{ "current_key": "AIzaSyPlaceholder" }]
            }],
            "configuration_version": "1"
          }
          EOF

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.24.3"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan secrets with Gitleaks
        run: gitleaks detect --source . --verbose --redact

      - name: Verify Java version
        run: java -version

      - name: Run Android Lint
        run: ./gradlew clean lintDebug
        env:
          MAPS_API_KEY: "AIzaSyPlaceholder"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
        env:
          MAPS_API_KEY: "AIzaSyPlaceholder"

      - name: Build debug APK
        run: ./gradlew assembleDebug
        env:
          MAPS_API_KEY: "AIzaSyPlaceholder"

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 1

      - name: Upload lint results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html
          retention-days: 1

      - name: Upload debug APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1
