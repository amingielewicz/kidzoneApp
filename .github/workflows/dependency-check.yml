name: Dependency Check

on:
  workflow_dispatch:
  schedule:
    - cron: '22 3 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: dependency-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Dependency Check data
        uses: actions/cache@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dependency-check-data-${{ runner.os }}-

      - name: Create dummy google-services.json
        run: |
          cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder-ci",
              "storage_bucket": "placeholder-ci.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "com.kidzone" }
              },
              "api_key": [{ "current_key": "AIzaSyPlaceholder" }]
            }],
            "configuration_version": "1"
          }
          EOF

      - name: Run OWASP Dependency Check
        run: ./gradlew dependencyCheckAnalyze
        env:
          MAPS_API_KEY: "AIzaSyPlaceholder"
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload Dependency Check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: build/reports/dependency-check-report.*
          retention-days: 14

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('build/reports/dependency-check-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build/reports/dependency-check-report.sarif
