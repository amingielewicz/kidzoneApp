name: Signed Release Build

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release name, for example v0.1.0-alpha'
        required: true
        default: 'v0.1.0-alpha'

permissions:
  contents: read

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate required secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          missing=0
          for secret_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD GOOGLE_SERVICES_JSON MAPS_API_KEY; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::$secret_name is not configured. Add it in GitHub repository secrets."
              missing=1
            fi
          done
          if [ -n "$GOOGLE_SERVICES_JSON" ] && echo "$GOOGLE_SERVICES_JSON" | grep -Eq 'placeholder-ci|AIzaSyPlaceholder|000000000000'; then
            echo "::error::GOOGLE_SERVICES_JSON looks like a placeholder. Use the production Firebase config."
            missing=1
          fi
          if [ "$MAPS_API_KEY" = "AIzaSyPlaceholder" ]; then
            echo "::error::MAPS_API_KEY is still the placeholder value."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Create google-services.json from secret
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore/kidzone-release.jks"

      - name: Build signed release bundle
        run: ./gradlew bundleRelease
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          KEYSTORE_PATH: ${{ runner.temp }}/keystore/kidzone-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.release_name }}-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 14

      - name: Upload mapping file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.release_name }}-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 14
